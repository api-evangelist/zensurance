name: Zensurance
kind: company
description: Zensurance is a Toronto-based digital commercial insurance brokerage founded
  in 2016 that sells small-business and freelancer coverage online across every Canadian
  province, placing risk with Canadian carriers rather than underwriting it. Its book
  is commercial property and casualty — general and commercial general liability, professional
  liability and errors and omissions, cyber liability, directors and officers, commercial
  property, commercial auto, builder's risk, and a long tail of trade- and profession-specific
  packages — sold through a quote-to-bind web flow marketed as an instant online price
  with licensed broker support and claims advocacy behind it. It sits in the thin digital-broker
  layer beneath Canada's Big-Few carrier oligopoly, in a market with no open-insurance
  mandate — OSFI supervises federally-regulated insurers prudentially while FSRA, the
  AMF, and the other provincial regulators own market conduct, and Consumer-Driven Banking
  excludes insurance outright. Its API posture reflects that. Zensurance publishes no
  public, self-serve developer portal, no reference documentation, and no downloadable
  OpenAPI, Swagger, GraphQL, or AsyncAPI definition. The company's partnership page
  advertises "seamless API integrations and co-branded white-label tools" for distribution
  partners, but the only route to that surface is a partnership application form —
  the integration is partner-gated and privately negotiated. A first-party host at
  api.zensurance.com answers on the public internet (HTTP 200, returning a bare version
  string, with a /health endpoint) but it is the undocumented backend for Zensurance's
  own quoting and policy application, not a published product API. No ACORD, AL3, ACORD
  XML, NGDS, or agency-management-system integration claim appears anywhere on the
  company's public web properties. The one machine-addressable surface the company
  does publish for automated consumers is an llms.txt at www.zensurance.com/llms.txt
  — a 178KB marketing index of its pages, blog posts, and FAQs (which inadvertently
  lists its zenstage.wpengine.com staging host rather than the production domain).
  It describes insurance products for AI assistants; it documents no API.
