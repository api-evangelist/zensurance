aid: zensurance
name: Zensurance
review:
  question: Does Zensurance expose a public, self-serve developer portal or downloadable
    API definitions for its insurance quote, bind, policy, or claims surfaces?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Canada
  gated: true
findings:
  summary: |
    Zensurance publishes no public developer portal and no machine-readable API
    definitions. Every candidate developer host was probed on 2026-07-25 and either
    failed to resolve or returned 404: developer.zensurance.com, developers.zensurance.com,
    docs.zensurance.com, and partners.zensurance.com do not resolve (curl exit,
    HTTP 000); www.zensurance.com/developers, /developer, /api, /docs, /partners,
    /partner, /integrations, /brokers, and /technology all return HTTP 404.

    api.zensurance.com resolves and returns HTTP 200, but it is not a product API.
    The root returns a five-byte body — the literal string "4.0.0" — with an
    Express-style hardened header set and a zsid-production session cookie;
    /health returns {"ok":true}. Every documentation and specification path
    probed against that host returns a JSON 404 from the application itself
    ({"status":404,"error":"NOT FOUND"}): /openapi.json, /openapi.yaml,
    /swagger.json, /swagger, /swagger-ui.html, /api-docs, /docs, /docs/,
    /spec, /redoc, /v1/openapi.json, /v1, /v2, /api/v1, /api/docs, /quotes,
    /v1/quotes, /graphql, and /graphql/. This is the undocumented backend for
    Zensurance's own customer application at app.zensurance.com, which is a
    login wall. No spec was harvested, so no openapi/ directory exists in
    this repo.

    The only integration claim Zensurance makes publicly is on its partnership
    page (https://www.zensurance.com/zensurance-partnerships, HTTP 200), verbatim:
    "Technical solutions: Seamless API integrations and co-branded white-label
    tools that align with your systems" and, under "What does technical
    integration entail?", "Our API solutions are designed for seamless
    integration with your existing systems, minimizing the need for extensive
    involvement from your tech team." No endpoint, base URL, authentication
    scheme, sandbox, or reference documentation accompanies those claims; the
    page's only call to action is a partnership application form. This is a
    marketing statement of a partner-gated, privately negotiated integration,
    not a developer portal — classified as (c) marketing page fronting (b) a
    partner gate.

    A wildcard host at zensurance.stoplight.io returns HTTP 200 but serves the
    generic Stoplight platform landing page (title "Stoplight", default platform
    meta description), not a Zensurance workspace — it is not a portal and was
    not counted. zensurance.readme.io returns 404 and zensurance.docs.apiary.io
    returns 502.

    The public GitHub organization github.com/zensurance ("Toronto based
    Insurtech startup") holds internal tooling, a Google Apps Script template,
    and forks of Azure AI/RAG samples. No OpenAPI, no SDK, no client library,
    no .proto.
