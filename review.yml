actions:
  openapiHarvested: false
  specsCount: 0
  apisListed: 0
  reason: |
    No public, self-serve API surface exists to catalog. apis[] is intentionally
    empty and no openapi/ directory was created, because nothing real was found
    to put in one. Zensurance is recorded as a partner-gated insurtech broker —
    which is the accurate reading of the Canadian insurance market, where there
    is no open-insurance mandate, Consumer-Driven Banking excludes insurance,
    and market conduct sits with provincial regulators rather than a national
    API rule. If Zensurance ever publishes partner API reference documentation
    or a specification, this record should be revisited.
