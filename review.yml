  acordPosture:
    posture: no ACORD reference found
    searched:
      - ACORD
      - AL3
      - ACORD XML
      - ACORD certified
      - NGDS
      - IVANS
      - Applied Epic
      - Vertafore
      - AMS360
      - agency download
    note: Zero matches for any ACORD, AL3, NGDS, IVANS, or agency-management-system
      term across www.zensurance.com (homepage, partnership page) and the site's
      page and post sitemaps (357 pages, plus the blog sitemap). Consistent with a
      direct-to-SMB digital broker that never touched the ACORD/AL3 agency-download
      rails the traditional Canadian brokerage channel runs on.
  insuranceVerbs:
    quote:
      exposed: false
      note: Quoting exists only in the first-party consumer web flow at
        www.zensurance.com and app.zensurance.com. No public quote API.
    bind:
      exposed: false
      note: Purchase completes inside the authenticated customer application.
    issue:
      exposed: false
      note: Policy documents are delivered through the customer portal. No policy
        administration API is published.
    fnol:
      exposed: false
      note: Claims are intaken by licensed broker staff (24/7 claims support). No
        FNOL API, no claims endpoint, no claims documentation.
    audience: consumer and partner, both through non-API channels — self-serve web
      for SMB buyers, application-gated private integration for distribution partners.
  authModel:
    scheme: undetermined — none published
    note: No authentication documentation exists. api.zensurance.com issues a
      zsid-production session cookie (HttpOnly, Secure, SameSite=None), indicating
      cookie-session auth for its own first-party client. Neither
      /.well-known/openid-configuration nor /.well-known/oauth-authorization-server
      is served (both 404), so no OAuth2 or OIDC surface is discoverable. Any
      partner API credentials are issued privately after a partnership agreement.
  webhooks:
    documented: false
    asyncapi: false
    note: No event catalog, no webhook documentation, no AsyncAPI. Absence is the
      finding.
  postman:
    publicWorkspace: false
    note: No public Postman workspace or collection found for Zensurance.
  graphql:
    documented: false
    note: /graphql and /graphql/ on api.zensurance.com both return the application's
      JSON 404. No GraphQL surface to introspect.
  grpc:
    documented: false
    note: No published .proto files.
  transports:
    - protocol: HTTPS (web application)
      scheme: https
      baseURL: https://www.zensurance.com/
      documented: true
      note: Public marketing site and self-serve quote funnel. Human interface only.
    - protocol: HTTPS (authenticated web application)
      scheme: https
      baseURL: https://app.zensurance.com/
      documented: true
      note: Customer portal behind a login wall.
    - protocol: REST (undocumented, first-party)
      scheme: https
      baseURL: https://api.zensurance.com
      documented: false
      note: Backend for the first-party application. Responds 200 at / and /health;
        every other probed path 404s. Not a published product API.
    - protocol: REST (partner)
      scheme: https
      documented: false
      note: Referenced only as "API integrations" on the partnership page. No host,
        no reference, no spec. Partner-gated.
    - protocol: GraphQL
      documented: false
    - protocol: WebSocket
      documented: false
    - protocol: ACORD AL3 / ACORD XML
      documented: false
      note: No ACORD transport of any kind referenced.
sources:
  - url: https://www.zensurance.com/
    type: Website
    note: Company overview — licensed Canadian commercial brokerage since 2016,
